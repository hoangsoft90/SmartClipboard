plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ============================================================================
// Release signing — plan12 mục 3.
// Keystore thật nằm NGOÀI repo (xem key.properties, đã ignore trong git).
// Nếu chưa có key.properties → fallback về debug signing cho máy dev.
// ============================================================================
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.smartclip.smartclipboard"
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.smartclip.smartclipboard"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        // networkSecurityConfig + usesCleartextTraffic referenced directly in AndroidManifest.xml
        // Cho phép HTTP cleartext tất cả domain (xem res/xml/network_security_config.xml)
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Fallback: máy dev chưa tạo key.properties → ký bằng debug keystore.
            // Máy CI/chủ dự án có key.properties → ký bằng keystore thật.
            signingConfig keystoreProperties.isEmpty()
                ? signingConfigs.debug
                : signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // local_auth uses BiometricPrompt API (available via Flutter plugin, no manual dep needed)
}
