name: Build Android APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Save custom files before flutter create
        run: |
          mkdir -p /tmp/custom-backup
          # Save pubspec files (flutter create --overwrite destroys them)
          cp pubspec.yaml /tmp/custom-backup/pubspec.yaml 2>/dev/null || true
          cp pubspec.lock /tmp/custom-backup/pubspec.lock 2>/dev/null || true
          # Save gradle wrapper (flutter create generates old version)
          cp android/gradle/wrapper/gradle-wrapper.properties /tmp/custom-backup/gradle-wrapper.properties 2>/dev/null || true
          # Save android custom files
          cp android/app/src/main/AndroidManifest.xml /tmp/custom-backup/AndroidManifest.xml 2>/dev/null || true
          cp -r android/app/src/main/res /tmp/custom-backup/res 2>/dev/null || true
          cp -r android/app/src/main/kotlin /tmp/custom-backup/kotlin 2>/dev/null || true
          cp android/app/build.gradle /tmp/custom-backup/app-build.gradle 2>/dev/null || true
          cp android/build.gradle /tmp/custom-backup/root-build.gradle 2>/dev/null || true
          cp android/settings.gradle /tmp/custom-backup/settings.gradle 2>/dev/null || true
          cp android/gradle.properties /tmp/custom-backup/gradle.properties 2>/dev/null || true
          echo "All custom files saved"

      - name: Generate Flutter platform scaffolding
        run: |
          flutter create . \
            --org com.smartclip \
            --project-name smart_clipboard \
            --platforms android \
            --overwrite

      - name: Restore custom files
        run: |
          # Restore pubspec (CRITICAL - flutter create overwrites it)
          cp /tmp/custom-backup/pubspec.yaml pubspec.yaml 2>/dev/null || true
          cp /tmp/custom-backup/pubspec.lock pubspec.lock 2>/dev/null || true
          # Restore gradle wrapper (needs 8.3+, flutter creates 7.6.3)
          cp /tmp/custom-backup/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          # Restore android custom files
          cp /tmp/custom-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp -r /tmp/custom-backup/res/* android/app/src/main/res/ 2>/dev/null || true
          cp -r /tmp/custom-backup/kotlin/* android/app/src/main/kotlin/ 2>/dev/null || true
          cp /tmp/custom-backup/app-build.gradle android/app/build.gradle 2>/dev/null || true
          cp /tmp/custom-backup/root-build.gradle android/build.gradle 2>/dev/null || true
          cp /tmp/custom-backup/settings.gradle android/settings.gradle 2>/dev/null || true
          cp /tmp/custom-backup/gradle.properties android/gradle.properties 2>/dev/null || true
          echo "All custom files restored"

      - name: Verify critical files
        run: |
          echo "=== Gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== pubspec.yaml head ==="
          head -30 pubspec.yaml
          echo "=== Android files ==="
          ls -la android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/res/xml/network_security_config.xml

      - name: Generate launcher icons
        run: |
          if command -v convert &> /dev/null; then
            chmod +x scripts/generate-icons.sh 2>/dev/null || true
            ./scripts/generate-icons.sh 2>/dev/null || echo "Icon generation skipped"
          else
            echo "ImageMagick not available, using vector icons"
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze --no-pub || true

      - name: Run Flutter tests
        run: flutter test --no-pub || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cd ..

      - name: Find built APKs
        run: |
          echo "=== Built APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== APK sizes ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-clipboard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-clipboard-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
