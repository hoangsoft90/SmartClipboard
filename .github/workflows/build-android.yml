name: Build Android APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.0"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      # FIX 4: Stable cache key based on pubspec.lock (NOT gradle files which change)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-agp870-g89-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-agp870-g89-
            gradle-${{ runner.os }}-

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      # FIX 2: No flutter create — Android files are already committed in git
      # This eliminates the cache invalidation problem entirely.

      - name: Verify critical files
        run: |
          echo "=== pubspec.yaml dependencies ==="
          grep -E "(sqflite|riverpod|crypto|local_auth|sentry|google_mobile_ads)" pubspec.yaml || echo "MISSING DEPS!"
          echo "=== Gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Android files ==="
          ls -la android/app/build.gradle android/app/src/main/AndroidManifest.xml android/settings.gradle

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze --no-pub || true

      - name: Run Flutter tests
        run: flutter test --no-pub || true

      # FIX 3: Add --info for Gradle output debugging
      - name: Build debug APK
        run: flutter build apk --debug --no-pub --info 2>&1 | tail -100

      - name: Build release APK
        run: flutter build apk --release --no-pub --info 2>&1 | tail -100

      - name: Find built APKs
        run: |
          echo "=== Built APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== APK sizes ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-clipboard-debug-apk
          path: |
            build/app/outputs/apk/debug/*.apk
            build/app/outputs/flutter-apk/app-debug.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-clipboard-release-apk
          path: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/flutter-apk/app-release.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
