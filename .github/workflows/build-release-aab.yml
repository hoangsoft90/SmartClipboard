name: Build Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.0"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-agp870-g89-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-agp870-g89-
            gradle-${{ runner.os }}-

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Keystore + key.properties được tái tạo ở mỗi lần build từ secrets,
      # nên keystore cố định (không đổi giữa các build) và không bao giờ nằm trong repo.
      - name: Restore release keystore from secrets
        run: |
          # Gradle resolve storeFile relative to the app module (android/app/) —
          # đặt keystore ở đó, key.properties vẫn nằm ở android/ (rootProject.file).
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore-release.jks
          EOF
          # Kiểm tra keystore hợp lệ (lệnh in ra cert sẽ fail nếu pass sai)
          keytool -list -keystore android/app/keystore-release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" > /dev/null
          echo "Keystore restored and verified"

      - name: Build release AAB
        run: flutter build appbundle --release --no-pub

      - name: Verify AAB is signed with release keystore (not debug)
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          echo "=== AAB signing cert ==="
          keytool -printcert -jarfile "$AAB" | grep -E "(Owner|SHA256|Valid from)" | head -5
          # Debug keystore có DN "Android Debug" — nếu thấy => build sai, fail luôn
          if keytool -printcert -jarfile "$AAB" | grep -q "Android Debug"; then
            echo "❌ AAB signed with DEBUG keystore — release signing failed"
            exit 1
          fi
          echo "✅ AAB is release-signed (no debug certificate found)"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: smart-clipboard-release-aab
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.aab
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error